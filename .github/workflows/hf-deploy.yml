name: Verify canonical Lyte publication ownership

# Historical filename only. This presentation package has no provider writer.
# A11oy publishes the source-owned lyte-services runtime to SZLHOLDINGS/lyte.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hf-deploy.yml
      - scripts/verify-hf-ownership.py
      - scripts/test_hf_ownership.py
      - README.md
      - .dockerignore
      - Dockerfile
      - Dockerfile.dockerignore
      - server.py
      - space/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lyte-canonical-delegation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify presentation, backend, and canonical publisher authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - name: Checkout exact presentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout the estate authority manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/.github
          ref: main
          path: governance
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout the canonical single publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/a11oy
          ref: main
          path: publisher
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reject wrong targets, invalid metadata and local writers offline
        run: python -I source/scripts/test_hf_ownership.py
      - name: Verify actual ownership and record the exact inspected commits
        run: >-
          python -I source/scripts/verify-hf-ownership.py
          --source source --governance governance --publisher publisher
          --output evidence/hf-canonical-delegation.json
      - name: Preserve the source-authority receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lyte-canonical-delegation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/hf-canonical-delegation.json
          if-no-files-found: error
          retention-days: 90
