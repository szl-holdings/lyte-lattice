name: Materialize Lyte lockfile consistency once
on:
  push:
    branches: [fix/lockfile-consistency-20260905]
    paths: [.github/workflows/repair-lockfile-once.yml]
permissions:
  contents: write
concurrency:
  group: lyte-lockfile-repair-once
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'szl-holdings/lyte-lattice' && github.ref == 'refs/heads/fix/lockfile-consistency-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Reconcile only the existing lock graph and prove a clean build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package.json)" = a8154c5373c86c8a971cec240fc8b945a03ffa5a
          test "$(npm --version)" = 10.9.8
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:dev
          git diff --exit-code -- package.json
          git diff --check
          node - <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show','HEAD:package-lock.json'], {encoding:'utf8',maxBuffer:4000000}));
          const after = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changes = Object.keys(after.packages).filter(k => JSON.stringify(before.packages[k]) !== JSON.stringify(after.packages[k]));
          console.log(JSON.stringify({schema:'szl.lyte-lock-consistency/v1',changedPackages:changes,sourcePackageJsonUnchanged:true,installScriptsExecuted:false},null,2));
          if (changes.length > 50) throw new Error('Unexpectedly broad dependency rewrite; manual review required');
          JS
      - name: Commit only the tested lockfile to its unchanged repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/lockfile-consistency-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git add -- package-lock.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lyte): reconcile npm peer dependency lock graph'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
